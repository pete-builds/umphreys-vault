name: CI

# The repo's first gate. Until 2026-10-03 it had Dependabot and no workflow, so 13 merged
# PRs (including the python 3.13 -> 3.14 base bump) ran no test at all. Same three commands
# the repo already uses locally: ruff check, mypy, pytest.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Matches the runtime image (Dockerfile: python:3.14-slim).
          python-version: "3.14"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.in
          python -m pip install -e . --no-deps

      - name: Ruff
        run: ruff check src tests

      - name: Mypy
        run: mypy src

      - name: Pytest
        run: pytest -q
